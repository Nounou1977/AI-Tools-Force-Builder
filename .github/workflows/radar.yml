name: Radar demandes chaudes

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan
        run: python radar/radar.py

      - name: Commit state
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar/data/
          git diff --cached --quiet || git commit -m "radar: update state"
          git push

      - name: Alert hot signals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("radar/data/latest.json")
          d=json.loads(p.read_text())
          for x in d.get("hot",[]):
              title="🔥 Radar: "+x["title"][:180]
              body=(f"Score: {x['score']}/100\n\nSource: {x['source']}\n\n"
                    f"{x['description'][:1500]}\n\nLink: {x['link']}\n\n"
                    "Validation humaine requise avant tout contact/publication.")
              subprocess.run(["gh","issue","create","--title",title,"--body",body],check=False)
          PY
